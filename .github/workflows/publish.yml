name: Publish to npm

# Pattern mirrored from signalk/charts-plugin and
# signalk/course-provider-plugin: tag-triggered, OIDC trusted publishing,
# provenance attestation. Two jobs: `release` cuts a GitHub Release from
# the tag; `publish` stages the SignalK-webapp bundle and pushes to npm.
#
# npm accepts publishes from this workflow through OIDC trusted
# publishing (npmjs.com package settings -> Trusted publishers), so no
# npm token is stored in the repo. The tarball is also attached to the
# GitHub Release so anyone can `npm install ./signalk-onaplotter-<ver>.tgz`.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    permissions:
      id-token: write   # OIDC trusted publishing (npm provenance)
      contents: write   # Attach tarball to the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install workloads
        run: dotnet workload install wasm-tools

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm CLI 11.5.1+; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      # esbuild is required by the MinifyPublishedJs target in
      # OnaPlotter.csproj. The Release publish below fails with a
      # clear MSBuild error if node_modules/esbuild is missing.
      - name: Install JS toolchain (esbuild)
        run: npm ci

      - name: Publish OnaPlotter (Release + AOT)
        run: dotnet publish OnaPlotter/OnaPlotter.csproj -c Release -o publish

      - name: Patch index.html base href
        run: sed -i 's|<base href="/" />|<base href="/signalk-onaplotter/" />|' publish/wwwroot/index.html

      - name: Set appsettings ServerUrl to auto
        run: |
          cat > publish/wwwroot/appsettings.json <<'EOF'
          { "SignalK": { "ServerUrl": "auto" } }
          EOF

      # The SDK precompressed index.html and appsettings.json before the
      # two patches above. SignalK server serves .br/.gz siblings of webapp
      # files, so stale siblings would boot the app with base href "/".
      - name: Drop stale precompressed siblings of patched files
        run: rm -f publish/wwwroot/{index.html,appsettings.json}.{br,gz}

      # Version from the tag - strip leading 'v'. So tag v1.2.3 maps
      # to npm version 1.2.3. Pre-release identifiers (-alpha / -beta
      # / -rc) pass through unchanged and pick up the matching npm
      # dist-tag in the publish step below.
      - name: Stage SignalK webapp bundle
        id: stage
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          stage=staging/signalk-onaplotter
          mkdir -p "$stage"
          sed "s|__VERSION__|$version|" deploy/package.json.template > "$stage/package.json"
          cp deploy/index.js "$stage/index.js"
          cp deploy/README.npm.md "$stage/README.md"
          cp LICENSE "$stage/LICENSE"
          cp -r publish/wwwroot "$stage/public"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "--- package.json ---"
          cat "$stage/package.json"

      - name: npm pack
        working-directory: ${{ steps.stage.outputs.stage }}
        run: npm pack

      # Attach the tarball to the GitHub Release so users who don't
      # want to depend on npm can grab it directly. Happens even with
      # publish-to-npm disabled.
      - name: Attach tarball to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.stage.outputs.stage }}/signalk-onaplotter-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag-suffix conditional picks the right dist-tag for pre-release
      # versions; `--provenance` records the CI run in npm's registry so
      # installers can verify the build.
      - name: Publish to npm
        working-directory: ${{ steps.stage.outputs.stage }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == *alpha* ]]; then
            npm publish --provenance --access public --tag alpha
          elif [[ "$tag" == *beta* ]]; then
            npm publish --provenance --access public --tag beta
          elif [[ "$tag" == *rc* ]]; then
            npm publish --provenance --access public --tag rc
          else
            npm publish --provenance --access public
          fi
