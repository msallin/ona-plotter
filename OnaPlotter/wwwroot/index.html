<!DOCTYPE html>
<!-- data-bs-theme="dark" so Bootstrap's .card / .form-* / .btn /
     .text-muted etc. pick their dark-theme tokens automatically. Without
     this, .card's default color cascades to #212529 (near-black) against
     our own dark .card background override -- the helm sees unclassified
     text as black-on-black. -->
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OnaPlotter" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="OnaPlotter.styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    <!-- iPad / iOS home-screen install: Safari rejects SVG for the
         apple-touch-icon since iOS 18 and silently falls back to a
         page screenshot. Pointing at a 180x180 PNG lets the home-
         screen tile actually show the OnaPlotter logo. The PNG is
         generated from favicon.svg by scripts/generate-pwa-icons.sh
         (Playwright-based) and committed alongside the SVG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">X</a>
    </div>

    <!-- Error relay bootstrap: synchronous, loaded BEFORE the Blazor
         runtime so the console.error wrapper + window listeners are
         armed in time to catch boot-time component exceptions. The
         Blazor WASM dispatcher catches Razor lifecycle errors
         internally and only logs them via console.error -- if our
         wrapper isn't installed first, those errors never reach the
         SignalK server log. See errorRelayBoot.js header for the
         full rationale. -->
    <script src="js/errorRelayBoot.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        // Settings page filter helper. Settings.razor calls this on every
        // keystroke in the "Find a setting" input: scroll the first
        // matching form-label into view and add a .settings-highlight
        // class for a second. Empty query clears any existing highlight.
        window.onaSettingsFilter = function (query) {
            const all = document.querySelectorAll('.form-label');
            all.forEach(el => el.classList.remove('settings-highlight'));
            const q = (query || '').trim().toLowerCase();
            if (!q) return;
            for (const label of all) {
                if (label.textContent.toLowerCase().includes(q)) {
                    label.classList.add('settings-highlight');
                    label.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
            }
        };
    </script>
</body>

</html>
