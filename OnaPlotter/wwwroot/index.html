<!DOCTYPE html>
<!-- data-bs-theme is set by the inline boot script below from the
     persisted theme in localStorage, BEFORE Bootstrap's CSS first
     evaluates. This avoids a flash of dark-themed Bootstrap chrome on
     a light-themed install (the previous hardcoded "dark" value was
     visibly wrong for half-a-second on light / high-contrast helms
     until themeApply.js::setTheme caught up). themeApply.js still owns
     the attribute at runtime once Settings.Theme is known; this script
     is just the pre-mount seed so first paint matches the helm's
     persisted choice. -->
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1.0 + user-scalable=no: disable iOS Safari's
         document-level pinch-to-zoom and double-tap zoom. The chart
         has its own pinch-to-zoom on the Leaflet container, and
         document-level pinch zooms the HUD chrome OUT of position
         (the cards float on absolute coordinates relative to the
         viewport, not the page). Helms double-tap on AIS targets
         and route lines constantly; without this, every other tap
         triggers an iOS zoom. Trade-off: disables browser-level
         zoom for vision-impaired users - mitigated by the high-
         contrast theme + the Big-Type setting on the Map page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OnaPlotter" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <base href="/" />
    <!-- Pre-mount theme seed. Reads the same "ona.theme" key that
         AppSettingsService persists and sets data-bs-theme + the
         matching theme-* class on <html> before Bootstrap CSS first
         parses. Mirrors the fold logic in themeApply.js::setTheme:
         dark stays dark, light + high-contrast collapse to Bootstrap's
         "light" palette (Bootstrap only ships two), system resolves
         via prefers-color-scheme so an iOS sunset flip lands on the
         right palette before Blazor boots. Wrapped in try/catch
         because localStorage throws in private-browsing mode and the
         page must still boot. -->
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('ona.theme');
                var known = ['light', 'dark', 'system', 'high-contrast'];
                var safe = known.indexOf(raw) >= 0 ? raw : 'system';
                var bs;
                if (safe === 'dark') bs = 'dark';
                else if (safe === 'system') {
                    bs = (window.matchMedia
                        && window.matchMedia('(prefers-color-scheme: dark)').matches)
                        ? 'dark' : 'light';
                } else bs = 'light';
                var html = document.documentElement;
                html.setAttribute('data-bs-theme', bs);
                html.classList.add('theme-' + safe);
            } catch (_) {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="OnaPlotter.styles.css" />
    <link rel="stylesheet" href="lib/leaflet/dist/leaflet.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    <!-- iPad / iOS home-screen install: Safari rejects SVG for the
         apple-touch-icon since iOS 18 and silently falls back to a
         page screenshot. Pointing at a 180x180 PNG lets the home-
         screen tile actually show the OnaPlotter logo. The PNG is
         generated from favicon.svg by scripts/generate-pwa-icons.sh
         (Playwright-based) and committed alongside the SVG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png" />
</head>

<body>
    <!-- Boot loading screen. Lives inside #app so Blazor swaps it
         out wholesale once the App component renders for the first
         time. Inline SVG of the favicon (rather than <img src="...">)
         so it renders before any external asset has loaded - on a
         cold start the helm sees a recognisable brand frame within
         the first paint, not the literal text "Loading...". The
         build stamp is populated below from window.OnaPlotterBuild
         (set by js/version.g.js, generated by the StampBuildInfo
         MSBuild target). The check is no-op-safe if version.g.js
         isn't present yet (fresh checkout, no build run). -->
    <div id="app">
        <div class="boot-shell">
            <div class="boot-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                    <defs>
                        <linearGradient id="bootBg" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#1e293b" />
                            <stop offset="1" stop-color="#0f172a" />
                        </linearGradient>
                    </defs>
                    <rect width="32" height="32" rx="7" fill="url(#bootBg)" />
                    <path d="M11 14 L16 7 L21 14 Z" fill="#60a5fa" />
                    <path d="M4 20 Q8 17.5 12 20 T20 20 T28 20" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
                    <path d="M4 25 Q8 22.5 12 25 T20 25 T28 25" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.5" />
                </svg>
            </div>
            <div class="boot-title">OnaPlotter</div>
            <div class="boot-spinner" role="progressbar" aria-label="Loading"></div>
            <div class="boot-status">Loading chartplotter...</div>
            <div class="boot-version" id="bootVersion"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">X</a>
    </div>

    <!-- Error relay bootstrap: synchronous, loaded BEFORE the Blazor
         runtime so the console.error wrapper + window listeners are
         armed in time to catch boot-time component exceptions. The
         Blazor WASM dispatcher catches Razor lifecycle errors
         internally and only logs them via console.error - if our
         wrapper isn't installed first, those errors never reach the
         SignalK server log. See errorRelayBoot.js header for the
         full rationale. -->
    <script src="js/errorRelayBoot.js"></script>
    <!-- Build stamp emitted by the StampBuildInfo MSBuild target.
         No-op gracefully on fresh checkouts where the file hasn't
         been generated yet (browser logs a 404, page works fine). -->
    <script src="js/version.g.js"></script>
    <script>
        // Populate the boot-screen build stamp if the build artefact
        // was loaded above. Stays empty otherwise so the loading
        // screen doesn't show a stale "build undefined" stamp.
        (function () {
            try {
                var b = window.OnaPlotterBuild;
                if (!b) return;
                var el = document.getElementById('bootVersion');
                if (el) el.textContent = 'build ' + b.hash + ' · ' + b.utc + ' UTC';
            } catch (_) { /* boot-time decoration; never block boot. */ }
        })();
    </script>
    <script src="lib/leaflet/dist/leaflet.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        // Settings page filter helper. Settings.razor calls this on every
        // keystroke in the "Find a setting" input: scroll the first
        // matching form-label into view and add a .settings-highlight
        // class for a second. Empty query clears any existing highlight.
        window.onaSettingsFilter = function (query) {
            const all = document.querySelectorAll('.form-label');
            all.forEach(el => el.classList.remove('settings-highlight'));
            const q = (query || '').trim().toLowerCase();
            if (!q) return;
            for (const label of all) {
                if (label.textContent.toLowerCase().includes(q)) {
                    label.classList.add('settings-highlight');
                    label.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
            }
        };

        // Tiny scroll-to-bottom helper used by the route-edit waypoint
        // list when the parent appends a new entry. Lives here (inline
        // global) rather than in a JS module so the route-edit panel
        // doesn't pay an import round-trip on every mount. Defensive
        // against missing element or detached node so a stale call
        // doesn't throw out of Blazor's render path.
        window.scrollElementToBottom = function (el) {
            try {
                if (el && typeof el.scrollTo === 'function') {
                    el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
                } else if (el) {
                    el.scrollTop = el.scrollHeight;
                }
            } catch (_) { /* element gone / unmounted; harmless. */ }
        };
    </script>
</body>

</html>
