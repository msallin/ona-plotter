<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Opaque white square behind the rounded logo rect. The four
       corner wedges outside the rx=7 curve are otherwise transparent
       and let the host's background colour bleed through; SignalK
       renders webapp icons against a blue tile, which made OnaPlotter
       look like it had four blue notches. Painting a white square
       first pins the notches to white everywhere it's rendered. -->
  <rect width="32" height="32" fill="#ffffff"/>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <path d="M11 14 L16 7 L21 14 Z" fill="#60a5fa"/>
  <path d="M4 20 Q8 17.5 12 20 T20 20 T28 20" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <path d="M4 25 Q8 22.5 12 25 T20 25 T28 25" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
